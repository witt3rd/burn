[package]
authors = ["Dilshod Tadjibaev (@antimora)"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Storage and serialization infrastructure for Burn"
documentation = "https://docs.rs/burn-store"
edition.workspace = true
keywords = [
    "deep-learning",
    "machine-learning",
    "tensor",
    "storage",
    "serialization",
]
license.workspace = true
name = "burn-store"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-store"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "safetensors", "memmap"]
memmap = ["std", "dep:memmap2"]
std = ["safetensors/std", "burn-core/std", "dep:regex", "byteorder/std"]
cuda = ["burn-core/cuda"]
metal = ["burn-core/metal"]
wgpu = ["burn-core/wgpu"]
safetensors = ["dep:safetensors"]

[dependencies]
burn-core = { workspace = true }
burn-tensor = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
half = { workspace = true }
memmap2 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hashbrown = { workspace = true }
byteorder = { workspace = true }
log = { workspace = true }
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
